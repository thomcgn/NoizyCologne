
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NoizyCologne | Cologne Nightlife</title>

  <meta
    name="description"
    content="NoizyCologne – Partys, Events und Nightlife in Köln. Folge uns auf Instagram."
  >

  <meta name="theme-color" content="#000000">

  <link rel="icon" type="image/png" href="assets/noizy-logo-white.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="landing">

    <div class="logo-frame">
      <img
        class="logo"
        src="assets/noizy-logo-white.png"
        alt="NoizyCologne"
        width="1000"
        height="1000"
      >
    </div>

    <a
      class="instagram-link"
      href="https://www.instagram.com/noizycologne/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="NoizyCologne auf Instagram öffnen"
    >

      <svg
        class="instagram-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>

      <span>@noizycologne</span>

    </a>

  </main>

</body>
</html>
