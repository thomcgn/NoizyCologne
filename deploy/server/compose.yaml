name: noizycologne

# Konservative Obergrenzen, keine Reservierung: Der VPS hat nur rund 4 GiB RAM.
# PostgreSQL und die API mit Tesseract-OCR brauchen Luft; der Browser-Overlay
# ergänzt 768 MiB (Worker) und 128 MiB (Gateway). Die Limits liegen deutlich über
# dem normalen Bedarf und sollen nur einen einzelnen ausreißernden Container
# begrenzen, nicht den Regelbetrieb drosseln.
# read_only/cap_drop bleiben bewusst ausgespart: API und DB schreiben in ihre
# Volumes (Medien/DB), Caddy nach /data und /config, und die Images benötigen
# beschreibbares /tmp. Diese Schreibpfade sind nicht nachweislich abgesichert.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    image: ghcr.io/thomcgn/noizycologne-backend:${IMAGE_TAG:?IMAGE_TAG must be an immutable commit SHA}
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      NOIZY_PUBLISH_ENABLED: "false"
      # Optional Instagram publishing infrastructure. All defaults are fail-closed;
      # deployment must never enable publishing here. Activation additionally
      # requires explicit fachliche Freigabe and a passed Meta PoC.
      INSTAGRAM_GATEWAY_ENABLED: ${INSTAGRAM_GATEWAY_ENABLED:-false}
      INSTAGRAM_GATEWAY_BASE_URL: ${INSTAGRAM_GATEWAY_BASE_URL:-https://graph.facebook.com/v21.0}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_GATEWAY_CONNECT_TIMEOUT_MS: ${INSTAGRAM_GATEWAY_CONNECT_TIMEOUT_MS:-3000}
      INSTAGRAM_GATEWAY_READ_TIMEOUT_MS: ${INSTAGRAM_GATEWAY_READ_TIMEOUT_MS:-10000}
      INSTAGRAM_GATEWAY_MAX_CONTAINER_POLLS: ${INSTAGRAM_GATEWAY_MAX_CONTAINER_POLLS:-10}
      INSTAGRAM_MEDIA_PUBLIC_BASE_URL: ${INSTAGRAM_MEDIA_PUBLIC_BASE_URL:-}
      INSTAGRAM_WORKER_ENABLED: ${INSTAGRAM_WORKER_ENABLED:-false}
      INSTAGRAM_WORKER_INTERVAL_MS: ${INSTAGRAM_WORKER_INTERVAL_MS:-60000}
      INSTAGRAM_WORKER_LEASE_MS: ${INSTAGRAM_WORKER_LEASE_MS:-300000}
      INSTAGRAM_WORKER_BATCH_SIZE: ${INSTAGRAM_WORKER_BATCH_SIZE:-5}
      INSTAGRAM_WORKER_POLL_DELAY_MS: ${INSTAGRAM_WORKER_POLL_DELAY_MS:-1000}
      INSTAGRAM_WORKER_RECONCILIATION_LIMIT: ${INSTAGRAM_WORKER_RECONCILIATION_LIMIT:-25}
      INSTAGRAM_GATE_POST_ORDER_SELECTED: ${INSTAGRAM_GATE_POST_ORDER_SELECTED:-false}
      INSTAGRAM_GATE_WEEKEND_DAY_BALANCE_REVIEWED: ${INSTAGRAM_GATE_WEEKEND_DAY_BALANCE_REVIEWED:-false}
      INSTAGRAM_GATE_POSTING_PLAN_CURRENT: ${INSTAGRAM_GATE_POSTING_PLAN_CURRENT:-false}
      INSTAGRAM_GATE_HANDLES_REVIEWED: ${INSTAGRAM_GATE_HANDLES_REVIEWED:-false}
      INSTAGRAM_GATE_CAPTION_STALE_CHECK: ${INSTAGRAM_GATE_CAPTION_STALE_CHECK:-false}
      INSTAGRAM_GATE_ADDITIONAL_WORKFLOW_DEFINED: ${INSTAGRAM_GATE_ADDITIONAL_WORKFLOW_DEFINED:-false}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_BROWSER_ENABLED: ${DISCOVERY_BROWSER_ENABLED:-false}
      DISCOVERY_EXTERNAL_CALENDAR_ENABLED: ${DISCOVERY_EXTERNAL_CALENDAR_ENABLED:-false}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 0 9 * * TUE}
      DISCOVERY_ZONE: ${DISCOVERY_ZONE:-Europe/Berlin}
      DISCOVERY_MAX_RESPONSE_BYTES: ${DISCOVERY_MAX_RESPONSE_BYTES:-2097152}
      NOIZY_MEDIA_ROOT: /app/uploads
      FACTORY_RESET_SECRET: ${FACTORY_RESET_SECRET:-}
      API_TRUST_SECRET: ${API_TRUST_SECRET:?API_TRUST_SECRET is required}
      API_TRUST_PREVIOUS_SECRET: ${API_TRUST_PREVIOUS_SECRET:-}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:?AUTH_SERVICE_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8080"]
    volumes:
      - media_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    networks: [internal]

  frontend:
    image: ghcr.io/thomcgn/noizycologne-frontend:${IMAGE_TAG:?IMAGE_TAG must be an immutable commit SHA}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    environment:
      TEAM_USER: ${TEAM_USER:?TEAM_USER is required}
      TEAM_PASSWORD_HASH: ${TEAM_PASSWORD_HASH:?TEAM_PASSWORD_HASH is required}
      TEAM_SESSION_SECRET: ${TEAM_SESSION_SECRET:?TEAM_SESSION_SECRET is required}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:?AUTH_SERVICE_SECRET is required}
      NOIZY_PUBLIC_ORIGIN: https://tsa.noizycologne.de
      FACTORY_RESET_SECRET: ${FACTORY_RESET_SECRET:-}
      NOIZY_INTERNAL_API_URL: http://api:8080
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks: [internal]

  landing:
    image: ghcr.io/thomcgn/noizycologne-landing:${IMAGE_TAG:?IMAGE_TAG must be an immutable commit SHA}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    expose: ["80"]
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:?AUTH_SERVICE_SECRET is required}
      API_TRUST_SECRET: ${API_TRUST_SECRET:?API_TRUST_SECRET is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      landing:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

networks:
  internal:
    name: noizycologne_default
    external: true

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:?POSTGRES_DATA_VOLUME is required}
    external: true
  caddy_data:
    name: ${CADDY_DATA_VOLUME:?CADDY_DATA_VOLUME is required}
    external: true
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME:?CADDY_CONFIG_VOLUME is required}
    external: true
  media_data:
    # Backward-compatible for existing VPS installations; deploy.sh creates only this new volume if absent.
    name: ${MEDIA_DATA_VOLUME:-noizycologne_media_data}
    external: true
