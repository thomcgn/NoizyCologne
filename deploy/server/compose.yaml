
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  landing:
    image: ghcr.io/thomcgn/noizycologne-landing:latest
    restart: unless-stopped
    expose:
      - "80"

  smoke:
    image: ghcr.io/thomcgn/noizycologne-smoke:latest
    restart: unless-stopped
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:
