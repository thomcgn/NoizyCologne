
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: noizycologne
      POSTGRES_USER: noizy
      POSTGRES_PASSWORD: noizy_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noizy -d noizycologne"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
