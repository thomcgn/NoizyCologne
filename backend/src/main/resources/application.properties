
spring.application.name=noizycologne-api

# PostgreSQL – lokale Entwicklung
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/noizycologne}
spring.datasource.username=${DB_USER:noizy}
spring.datasource.password=${DB_PASSWORD:noizy_dev_only}

# Hibernate verwaltet unser Schema nicht selbst
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway übernimmt die Datenbankmigrationen
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Private, persistent media storage. The staging container overrides this with /app/uploads.
noizy.media.root=${MEDIA_ROOT:./uploads}
noizy.ai.tesseract.command=${TESSERACT_COMMAND:tesseract}
noizy.ai.tesseract.languages=${TESSERACT_LANGUAGES:deu+eng}
noizy.ai.tesseract.timeout-seconds=${TESSERACT_TIMEOUT_SECONDS:30}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.profiles.default=local

# Weekly discovery; manual scans remain available while scheduling is disabled.
noizy.discovery.enabled=${DISCOVERY_ENABLED:true}
noizy.discovery.cron=${DISCOVERY_CRON:0 0 9 * * TUE}
noizy.discovery.zone=${DISCOVERY_ZONE:Europe/Berlin}
noizy.discovery.max-response-bytes=${DISCOVERY_MAX_RESPONSE_BYTES:2097152}

# Existing official events in the coming 21 days; independent of the weekly search.
noizy.discovery.monitor.enabled=${DISCOVERY_MONITOR_ENABLED:true}
noizy.discovery.monitor.cron=${DISCOVERY_MONITOR_CRON:0 0 9 * * *}

# Optional internal browser gateway; disabled unless deliberately configured.
noizy.discovery.browser.enabled=${DISCOVERY_BROWSER_ENABLED:false}
noizy.discovery.browser.url=${DISCOVERY_BROWSER_URL:http://browser-gateway:3128/render}
noizy.discovery.browser.token=${BROWSER_WORKER_TOKEN:}
