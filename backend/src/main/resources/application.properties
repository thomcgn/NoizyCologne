
spring.application.name=noizycologne-api

# PostgreSQL – lokale Entwicklung
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/noizycologne}
spring.datasource.username=${DB_USER:noizy}
spring.datasource.password=${DB_PASSWORD:noizy_dev_only}

# Hibernate verwaltet unser Schema nicht selbst
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway übernimmt die Datenbankmigrationen
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Private, persistent media storage. The staging container overrides this with /app/uploads.
noizy.media.root=${MEDIA_ROOT:./uploads}
# Dedicated internal reset key; feature remains disabled until configured.
noizy.factory-reset.secret=${FACTORY_RESET_SECRET:}
noizy.ai.tesseract.command=${TESSERACT_COMMAND:tesseract}
noizy.ai.tesseract.languages=${TESSERACT_LANGUAGES:deu+eng}
noizy.ai.tesseract.timeout-seconds=${TESSERACT_TIMEOUT_SECONDS:30}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.profiles.default=local

# Weekly discovery; manual scans remain available while scheduling is disabled.
noizy.discovery.enabled=${DISCOVERY_ENABLED:true}
noizy.discovery.cron=${DISCOVERY_CRON:0 0 9 * * TUE}
noizy.discovery.zone=${DISCOVERY_ZONE:Europe/Berlin}
noizy.discovery.max-response-bytes=${DISCOVERY_MAX_RESPONSE_BYTES:2097152}

# Existing official events in the coming 21 days; independent of the weekly search.
noizy.discovery.monitor.enabled=${DISCOVERY_MONITOR_ENABLED:true}
noizy.discovery.monitor.cron=${DISCOVERY_MONITOR_CRON:0 0 9 * * *}

# Optional internal browser gateway; disabled unless deliberately configured.
noizy.discovery.browser.enabled=${DISCOVERY_BROWSER_ENABLED:false}
noizy.discovery.browser.url=${DISCOVERY_BROWSER_URL:http://browser-gateway:3128/render}
noizy.discovery.browser.token=${BROWSER_WORKER_TOKEN:}

# Generische externe Kalenderquellen (ICS/JSON): nur nach ausdrücklicher Freigabe aktivieren.
noizy.discovery.external-calendar.enabled=${DISCOVERY_EXTERNAL_CALENDAR_ENABLED:false}

# Instagram-Publishing bleibt vollständig fail-closed. Das Schalter-Flag bleibt false,
# solange die zusätzlichen fachlichen Pflichtschritte nicht freigegeben sind.
noizy.publish.enabled=${NOIZY_PUBLISH_ENABLED:false}

# Meta-Graph-API-Adapter: nur bei explizitem Opt-in und vorhandenem Token aktiv.
# Kein Token in dieser Datei; das Token kommt ausschließlich aus der Umgebung.
noizy.instagram.gateway.enabled=${INSTAGRAM_GATEWAY_ENABLED:false}
noizy.instagram.gateway.base-url=${INSTAGRAM_GATEWAY_BASE_URL:https://graph.facebook.com/v21.0}
noizy.instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
noizy.instagram.gateway.connect-timeout-ms=${INSTAGRAM_GATEWAY_CONNECT_TIMEOUT_MS:3000}
noizy.instagram.gateway.read-timeout-ms=${INSTAGRAM_GATEWAY_READ_TIMEOUT_MS:10000}
noizy.instagram.gateway.max-container-polls=${INSTAGRAM_GATEWAY_MAX_CONTAINER_POLLS:10}

# Öffentlich abrufbare, zeitlich begrenzte HTTPS-Basis für Beitragsbilder.
# Leer = kein Bildversand möglich; die Infrastruktur bleibt auch dann inaktiv.
noizy.instagram.media-public-base-url=${INSTAGRAM_MEDIA_PUBLIC_BASE_URL:}

# Automatischer Worker: zusätzlich an noizy.publish.enabled gebunden.
noizy.instagram.worker.enabled=${INSTAGRAM_WORKER_ENABLED:false}
noizy.instagram.worker.interval-ms=${INSTAGRAM_WORKER_INTERVAL_MS:60000}
noizy.instagram.worker.lease-ms=${INSTAGRAM_WORKER_LEASE_MS:300000}
noizy.instagram.worker.batch-size=${INSTAGRAM_WORKER_BATCH_SIZE:5}
noizy.instagram.worker.poll-delay-ms=${INSTAGRAM_WORKER_POLL_DELAY_MS:1000}
noizy.instagram.worker.reconciliation-limit=${INSTAGRAM_WORKER_RECONCILIATION_LIMIT:25}

# Konfigurative Freigaben der Review-Gates: alle false, bis fachlich abgenommen.
# Insbesondere bleibt ADDITIONAL_WORKFLOW_DEFINED blockiert.
noizy.instagram.gates.post-order-selected=${INSTAGRAM_GATE_POST_ORDER_SELECTED:false}
noizy.instagram.gates.weekend-day-balance-reviewed=${INSTAGRAM_GATE_WEEKEND_DAY_BALANCE_REVIEWED:false}
noizy.instagram.gates.posting-plan-current=${INSTAGRAM_GATE_POSTING_PLAN_CURRENT:false}
noizy.instagram.gates.handles-reviewed=${INSTAGRAM_GATE_HANDLES_REVIEWED:false}
noizy.instagram.gates.caption-stale-check=${INSTAGRAM_GATE_CAPTION_STALE_CHECK:false}
noizy.instagram.gates.additional-workflow-defined=${INSTAGRAM_GATE_ADDITIONAL_WORKFLOW_DEFINED:false}

# Server-only Caddy -> API boundary. Missing secret denies all business requests.
noizy.api.trust.secret=${API_TRUST_SECRET:}
noizy.api.trust.previous-secret=${API_TRUST_PREVIOUS_SECRET:}
noizy.api.public-origin=${NOIZY_PUBLIC_ORIGIN:https://tsa.noizycologne.de}

# Dedicated Next server -> persistent auth store key; missing key keeps endpoint disabled.
noizy.auth.service-secret=${AUTH_SERVICE_SECRET:}
