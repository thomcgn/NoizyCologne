name: NoizyCologne CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialisiert Läufe pro Ref. Ein main-Lauf wird nicht abgebrochen: ghcr.yml
# verlangt einen abgeschlossenen erfolgreichen CI-Lauf als Freigabe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full:
    name: Full validation
    uses: ./.github/workflows/quality-full.yml
    with:
      # On a PR this is the tested merge commit, not the PR's head SHA.
      target-sha: ${{ github.sha }}

  quality:
    name: Full quality gate
    if: always()
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful full validation
        env:
          FULL_RESULT: ${{ needs.full.result }}
        run: test "$FULL_RESULT" = success
