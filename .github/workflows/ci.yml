name: NoizyCologne CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          test -f README.md
          test -f .gitignore
          test -d backend
          test -d frontend
          test -d deploy
          test -d docs
          echo "NoizyCologne structure OK"

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Full quality gate
        run: scripts/check-quality.sh --full

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.invalid \
            -v "$PWD/deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
