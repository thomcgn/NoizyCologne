name: NoizyCologne CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          test -f README.md
          test -f .gitignore
          test -d backend
          test -d frontend
          test -d deploy
          test -d docs
          echo "NoizyCologne structure OK"
