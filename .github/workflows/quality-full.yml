name: Reusable full quality validation

on:
  workflow_call:
    inputs:
      target-sha:
        description: Immutable commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Full validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-sha }}
          persist-credentials: false

      - name: Verify checked out commit
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Verify project structure
        run: |
          test -f README.md
          test -f .gitignore
          test -d backend
          test -d frontend
          test -d deploy
          test -d docs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Full quality gate
        run: scripts/check-quality.sh --full

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.invalid \
            -e AUTH_SERVICE_SECRET=isolated-auth-service-fixture-key-never-production \
            -e API_TRUST_SECRET=isolated-ci-caddy-api-key-at-least-32-characters \
            -v "$PWD/deploy/server/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Caddy security headers
        run: python3 scripts/test-caddy-headers.py
