
name: NoizyCologne Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: noizycologne-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project
        run: |
          test -f deploy/smoke/Dockerfile
          test -f README.md
          echo "Project structure OK"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/smoke
          push: true
          tags: |
            ghcr.io/thomcgn/noizycologne-smoke:latest
            ghcr.io/thomcgn/noizycologne-smoke:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy Docker image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            deploy@tsa.noizycologne.de \
            'set -eu
             cd /opt/noizycologne

             cfg=$(mktemp -d)
             trap "rm -rf -- \"$cfg\"" EXIT

             docker --config "$cfg" login ghcr.io \
               -u thomcgn --password-stdin >/dev/null

             docker --config "$cfg" compose pull smoke
             docker --config "$cfg" compose up -d --no-deps smoke
             docker compose ps smoke
            '

      - name: Verify live deployment
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            https://tsa.noizycologne.de/ \
            | grep -q "NoizyCologne"
