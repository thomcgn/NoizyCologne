
name: NoizyCologne GHCR Test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/smoke
          push: true
          tags: |
            ghcr.io/thomcgn/noizycologne-smoke:latest
            ghcr.io/thomcgn/noizycologne-smoke:${{ github.sha }}
