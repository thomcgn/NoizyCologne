name: NoizyCologne Auto Deploy

on:
  # CI owns the expensive FULL run. Never deploy a branch tip from this event:
  # github.sha belongs to the default branch, not necessarily the tested commit.
  workflow_run:
    workflows: [NoizyCologne CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: noizycologne-production
  cancel-in-progress: false

jobs:
  guard:
    name: Skip stale automatic triggers
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check triggering commit against main
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read-only pre-check: exit 2 means a stale trigger, which is a clean
          # skip rather than a failure. Any other error stays blocking. The
          # strict plan/verify authorization is still required for every deploy.
          if python3 scripts/quality-deployment.py check-current; then
            printf 'stale=false\n' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              printf 'stale=true\n' >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

  resolve:
    name: Resolve exact qualified commit
    needs: guard
    if: needs.guard.outputs.stale != 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.proof.outputs.sha }}
      kind: ${{ steps.proof.outputs.kind }}
      run_id: ${{ steps.proof.outputs.run_id }}
      attempt: ${{ steps.proof.outputs.attempt }}
      reuse: ${{ steps.proof.outputs.reuse }}
      automatic: ${{ steps.proof.outputs.automatic }}
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify triggering run and resolve immutable SHA
        id: proof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/quality-deployment.py plan

  full:
    name: Full validation
    needs: resolve
    if: needs.resolve.outputs.reuse == 'false'
    uses: ./.github/workflows/quality-full.yml
    with:
      target-sha: ${{ needs.resolve.outputs.sha }}

  authorize:
    name: Require exact successful FULL proof
    needs: [resolve, full]
    if: always() && needs.resolve.result == 'success' && (needs.resolve.outputs.reuse == 'true' || needs.full.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.resolve.outputs.sha }}
      kind: ${{ needs.resolve.outputs.kind }}
      run_id: ${{ needs.resolve.outputs.run_id }}
      attempt: ${{ needs.resolve.outputs.attempt }}
      automatic: ${{ needs.resolve.outputs.automatic }}
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Recheck exact FULL proof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          QUALITY_PROOF_KIND: ${{ needs.resolve.outputs.kind }}
          QUALITY_PROOF_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          QUALITY_PROOF_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
          QUALITY_AUTOMATIC: ${{ needs.resolve.outputs.automatic }}
        run: python3 scripts/quality-deployment.py verify

  publish:
    needs: authorize
    if: ${{ !cancelled() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout qualified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .quality-control
          persist-credentials: false

      - name: Verify exact commit before publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          QUALITY_PROOF_KIND: ${{ needs.authorize.outputs.kind }}
          QUALITY_PROOF_RUN_ID: ${{ needs.authorize.outputs.run_id }}
          QUALITY_PROOF_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
          QUALITY_AUTOMATIC: ${{ needs.authorize.outputs.automatic }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALITY_TARGET_SHA"
          python3 .quality-control/scripts/quality-deployment.py verify

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          pull: true
          cache-from: type=gha,scope=noizycologne-backend
          cache-to: type=gha,scope=noizycologne-backend,mode=max
          tags: |
            ghcr.io/thomcgn/noizycologne-backend:latest
            ghcr.io/thomcgn/noizycologne-backend:${{ needs.authorize.outputs.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          pull: true
          cache-from: type=gha,scope=noizycologne-frontend
          cache-to: type=gha,scope=noizycologne-frontend,mode=max
          tags: |
            ghcr.io/thomcgn/noizycologne-frontend:latest
            ghcr.io/thomcgn/noizycologne-frontend:${{ needs.authorize.outputs.sha }}
        
      - name: Build and push landing
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/landing
          push: true
          pull: true
          cache-from: type=gha,scope=noizycologne-landing
          cache-to: type=gha,scope=noizycologne-landing,mode=max
          tags: |
            ghcr.io/thomcgn/noizycologne-landing:latest
            ghcr.io/thomcgn/noizycologne-landing:${{ needs.authorize.outputs.sha }}

      - name: Build and push browser worker
        uses: docker/build-push-action@v6
        with:
          context: ./browser-worker
          push: true
          pull: true
          cache-from: type=gha,scope=noizycologne-browser-worker
          cache-to: type=gha,scope=noizycologne-browser-worker,mode=max
          tags: ghcr.io/thomcgn/noizycologne-browser-worker:${{ needs.authorize.outputs.sha }}

      - name: Build and push browser gateway
        uses: docker/build-push-action@v6
        with:
          context: ./browser-worker
          file: ./browser-worker/Dockerfile.gateway
          push: true
          pull: true
          cache-from: type=gha,scope=noizycologne-browser-gateway
          cache-to: type=gha,scope=noizycologne-browser-gateway,mode=max
          tags: ghcr.io/thomcgn/noizycologne-browser-gateway:${{ needs.authorize.outputs.sha }}


  deploy:
    needs: [authorize, publish]
    if: ${{ !cancelled() && needs.authorize.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read

    steps:
      - name: Checkout qualified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .quality-control
          persist-credentials: false

      - name: Verify exact commit before deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_TARGET_SHA: ${{ needs.authorize.outputs.sha }}
          QUALITY_PROOF_KIND: ${{ needs.authorize.outputs.kind }}
          QUALITY_PROOF_RUN_ID: ${{ needs.authorize.outputs.run_id }}
          QUALITY_PROOF_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
          QUALITY_AUTOMATIC: ${{ needs.authorize.outputs.automatic }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALITY_TARGET_SHA"
          python3 .quality-control/scripts/quality-deployment.py verify

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy Docker image
        id: rollout
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            deploy@tsa.noizycologne.de \
            'mkdir -p /opt/noizycologne/deploy/server/releases/${{ needs.authorize.outputs.sha }}'

          scp \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            deploy/server/Caddyfile \
            deploy/server/compose.yaml \
            deploy/server/compose.browser.yaml \
            browser-worker/seccomp_profile.json \
            deploy/server/deploy.sh \
            deploy/server/backup.sh \
            deploy/server/backup.py \
            deploy/server/restore-test.sh \
            deploy@tsa.noizycologne.de:/opt/noizycologne/deploy/server/releases/${{ needs.authorize.outputs.sha }}/

          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            deploy@tsa.noizycologne.de \
            'set -eu
             cd /opt/noizycologne

             cfg=$(mktemp -d)
             trap "rm -rf -- \"$cfg\"" EXIT

             chmod 0755 deploy/server/releases/${{ needs.authorize.outputs.sha }}/deploy.sh deploy/server/releases/${{ needs.authorize.outputs.sha }}/backup.sh

             docker --config "$cfg" login ghcr.io \
               -u thomcgn --password-stdin >/dev/null

             NOIZY_SERVER_DIR="$PWD/deploy/server" DOCKER_CONFIG="$cfg" ./deploy/server/releases/${{ needs.authorize.outputs.sha }}/deploy.sh '${{ needs.authorize.outputs.sha }}'
            '

      - name: Verify live deployment
        id: smoke
        env:
          TEAM_SMOKE_USER: ${{ secrets.TEAM_SMOKE_USER }}
          TEAM_SMOKE_PASSWORD: ${{ secrets.TEAM_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          login_payload="$(jq -n \
            --arg username "$TEAM_SMOKE_USER" \
            --arg password "$TEAM_SMOKE_PASSWORD" \
            '{username: $username, password: $password}')"

          login_status="$(curl --silent --show-error \
            --retry 5 --retry-delay 2 \
            --output "$smoke_dir/login.json" \
            --write-out '%{http_code}' \
            --cookie-jar "$smoke_dir/cookies.txt" \
            --header 'Origin: https://tsa.noizycologne.de' \
            --header 'Content-Type: application/json' \
            --data "$login_payload" \
            https://tsa.noizycologne.de/api/auth/login)"
          test "$login_status" = 200
          grep -q '"ok":true' "$smoke_dir/login.json"

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            --cookie "$smoke_dir/cookies.txt" \
            https://tsa.noizycologne.de/dashboard \
            | grep -q "NoizyCologne"

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 \
            --cookie "$smoke_dir/cookies.txt" \
            https://tsa.noizycologne.de/api/v1/venues >/dev/null

          logout_status="$(curl --silent --show-error \
            --output "$smoke_dir/logout.json" \
            --write-out '%{http_code}' \
            --cookie "$smoke_dir/cookies.txt" \
            --header 'Origin: https://tsa.noizycologne.de' \
            --request POST \
            https://tsa.noizycologne.de/api/auth/logout)"
          test "$logout_status" = 200

          unauthenticated_status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --cookie "$smoke_dir/cookies.txt" \
            https://tsa.noizycologne.de/api/v1/venues)"
          test "$unauthenticated_status" = 401

      - name: Verify production browser pipeline
        id: browser_smoke
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            deploy@tsa.noizycologne.de \
            'NOIZY_SERVER_DIR=/opt/noizycologne/deploy/server /opt/noizycologne/deploy/server/releases/${{ needs.authorize.outputs.sha }}/deploy.sh --browser-smoke'

      - name: Remove legacy smoke service after successful cutover
        id: cutover
        if: success()
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            deploy@tsa.noizycologne.de \
            'docker compose -p noizycologne -f /opt/noizycologne/compose.yaml rm -sf smoke'

      - name: Restore previous qualified release after failed smoke
        if: failure() && steps.rollout.outcome == 'success' && (steps.smoke.outcome == 'failure' || steps.browser_smoke.outcome == 'failure' || steps.cutover.outcome == 'failure')
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            deploy@tsa.noizycologne.de \
            'NOIZY_SERVER_DIR=/opt/noizycologne/deploy/server /opt/noizycologne/deploy/server/releases/${{ needs.authorize.outputs.sha }}/deploy.sh --rollback'
